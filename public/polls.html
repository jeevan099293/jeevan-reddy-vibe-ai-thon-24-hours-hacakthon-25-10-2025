<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Polls - Smart Campus</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body>
  <nav class="navbar navbar-dashboard">
    <div class="container">
      <div class="nav-brand">
  <picture>
    <source srcset="/images/klh-official.png" type="image/png">
    <img src="/images/klh-logo.svg" alt="KLH University" class="site-logo">
  </picture>
        <span>Smart Campus</span>
      </div>
      <ul class="nav-menu">
        <li><a href="/dashboard"><i class="fas fa-home"></i> Dashboard</a></li>
  <li><a href="/polls" class="active"><i class="fas fa-poll"></i> Polls</a></li>
  <li><a href="/resources"><i class="fas fa-folder-open"></i> Resources</a></li>
      </ul>
      <div class="user-menu">
        <span id="userName">User</span>
        <button onclick="logout()" class="btn btn-small"><i class="fas fa-sign-out-alt"></i> Logout</button>
      </div>
    </div>
  </nav>

  <div class="page-container">
    <div class="page-header">
      <h1><i class="fas fa-poll"></i> Campus Polls</h1>
      <p style="color: var(--text-secondary);">Vote on campus questions. Admin/Faculty can create polls.</p>
    </div>

    <section class="card">
      <form id="pollForm" class="modal-form" style="margin-bottom: 12px; display:none;">
        <div class="form-group">
          <label>Question</label>
          <input type="text" name="question" required />
        </div>
        <div id="optionsWrap">
          <div class="form-group"><input type="text" name="option" placeholder="Option 1" required /></div>
          <div class="form-group"><input type="text" name="option" placeholder="Option 2" required /></div>
        </div>
        <div class="form-row">
          <button type="button" id="addOptionBtn" class="btn">+ Add Option</button>
          <div style="flex:1"></div>
          <button type="submit" class="btn btn-primary"><i class="fas fa-plus"></i> Create Poll</button>
        </div>
      </form>
      <div id="pollsList" class="list"></div>
    </section>
  </div>

  <script src="/js/utils.js"></script>
  <script src="/js/polls.js"></script>
</body>
</html>
