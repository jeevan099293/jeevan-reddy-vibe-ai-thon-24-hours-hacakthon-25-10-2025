<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lost & Found - Smart Campus</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav class="navbar navbar-dashboard">
        <div class="container">
            <div class="nav-brand">
                <img src="/images/logo.svg" alt="KLH University" class="site-logo">
                <span>Smart Campus</span>
            </div>
            <ul class="nav-menu">
                <li><a href="/dashboard"><i class="fas fa-home"></i> Dashboard</a></li>
                <li><a href="/lost-found" class="active"><i class="fas fa-search"></i> Lost & Found</a></li>
                <li><a href="/events"><i class="fas fa-calendar-alt"></i> Events</a></li>
                <li><a href="/feedback"><i class="fas fa-comments"></i> Feedback</a></li>
                <li><a href="/clubs"><i class="fas fa-users"></i> Clubs</a></li>
            </ul>
            <div class="user-menu">
                <span id="userName">User</span>
                <button onclick="logout()" class="btn btn-small"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </div>
        </div>
    </nav>

    <div class="page-container">
        <div class="page-header">
            <h1><i class="fas fa-search"></i> Lost & Found</h1>
            <button class="btn btn-primary" onclick="openReportModal()">
                <i class="fas fa-plus"></i> Report Item
            </button>
        </div>

        <div class="filters">
            <div class="filter-group">
                <button class="filter-btn active" data-filter="all">All Items</button>
                <button class="filter-btn" data-filter="lost">Lost</button>
                <button class="filter-btn" data-filter="found">Found</button>
            </div>
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Search items...">
            </div>
        </div>

        <div class="items-grid" id="itemsContainer">
            <div class="loading">Loading items...</div>
        </div>
    </div>

    <!-- Report Item Modal -->
    <div class="modal" id="reportModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Report Lost/Found Item</h2>
                <button class="close-btn" onclick="closeReportModal()">&times;</button>
            </div>
            <form id="reportForm" class="modal-form">
                <div class="form-group">
                    <label>Type</label>
                    <div class="radio-group">
                        <label>
                            <input type="radio" name="type" value="lost" checked>
                            <span>Lost</span>
                        </label>
                        <label>
                            <input type="radio" name="type" value="found">
                            <span>Found</span>
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="item_name">Item Name</label>
                    <input type="text" id="item_name" name="item_name" required>
                </div>

                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" name="category" required>
                        <option value="">Select Category</option>
                        <option value="electronics">Electronics</option>
                        <option value="documents">Documents</option>
                        <option value="accessories">Accessories</option>
                        <option value="clothing">Clothing</option>
                        <option value="books">Books</option>
                        <option value="other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description" name="description" rows="3" required></textarea>
                </div>

                <div class="form-group">
                    <label for="location">Location</label>
                    <input type="text" id="location" name="location" required placeholder="Where was it lost/found?">
                </div>

                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" name="date" required>
                </div>

                <div class="form-group">
                    <label for="contact">Contact Info</label>
                    <input type="text" id="contact" name="contact" required placeholder="Phone or Email">
                </div>

                <div class="form-group">
                    <label for="image_file">Image (Optional)</label>
                    <input type="file" id="image_file" name="image_file" accept="image/*">
                    <small class="text-muted">You can upload a photo from your device or provide an external URL after submitting.</small>
                </div>

                <button type="submit" class="btn btn-primary btn-block">Submit Report</button>
            </form>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/socket.js"></script>
    <script src="/js/lost_found.js"></script>
</body>
</html>
