<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Announcements - Smart Campus</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body>
  <nav class="navbar navbar-dashboard">
    <div class="container">
      <div class="nav-brand">
    <img src="/images/logo.svg" alt="KLH University" class="site-logo">
        <span>Smart Campus</span>
      </div>
      <ul class="nav-menu">
        <li><a href="/dashboard"><i class="fas fa-home"></i> Dashboard</a></li>
        <li><a href="/lost-found"><i class="fas fa-search"></i> Lost & Found</a></li>
        <li><a href="/events"><i class="fas fa-calendar-alt"></i> Events</a></li>

      <div class="user-menu">

      <p style="color: var(--text-secondary);">Latest campus updates and important notices.</p>

  <script src="/js/utils.js"></script>
