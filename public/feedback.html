<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback - Smart Campus</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav class="navbar navbar-dashboard">
        <div class="container">
            <div class="nav-brand">
                <img src="/images/logo.svg" alt="KLH University" class="site-logo">
                <span>Smart Campus</span>
            </div>
            <ul class="nav-menu">
                <li><a href="/dashboard"><i class="fas fa-home"></i> Dashboard</a></li>
                <li><a href="/lost-found"><i class="fas fa-search"></i> Lost & Found</a></li>
                <li><a href="/events"><i class="fas fa-calendar-alt"></i> Events</a></li>
                <li><a href="/feedback" class="active"><i class="fas fa-comments"></i> Feedback</a></li>
                <li><a href="/clubs"><i class="fas fa-users"></i> Clubs</a></li>
            </ul>
            <div class="user-menu">
                <span id="userName">User</span>
                <button onclick="logout()" class="btn btn-small"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </div>
        </div>
    </nav>

    <div class="page-container">
        <div class="page-header">
            <h1><i class="fas fa-comments"></i> Feedback & Grievances</h1>
            <button class="btn btn-primary" onclick="openFeedbackModal()">
                <i class="fas fa-plus"></i> Submit Feedback
            </button>
        </div>

        <div class="feedback-stats" id="feedbackStats">
            <div class="stat-box">
                <i class="fas fa-paper-plane"></i>
                <h3>0</h3>
                <p>Total Submitted</p>
            </div>
            <div class="stat-box">
                <i class="fas fa-clock"></i>
                <h3>0</h3>
                <p>Pending</p>
            </div>
            <div class="stat-box">
                <i class="fas fa-check-circle"></i>
                <h3>0</h3>
                <p>Resolved</p>
            </div>
        </div>

        <div class="filters">
            <div class="filter-group">
                <button class="filter-btn active" data-filter="all">All Feedback</button>
                <button class="filter-btn" data-filter="pending">Pending</button>
                <button class="filter-btn" data-filter="resolved">Resolved</button>
            </div>
        </div>

        <div class="feedback-list" id="feedbackContainer">
            <div class="loading">Loading feedback...</div>
        </div>
    </div>

    <!-- Submit Feedback Modal -->
    <div class="modal" id="feedbackModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Submit Feedback</h2>
                <button class="close-btn" onclick="closeFeedbackModal()">&times;</button>
            </div>
            <form id="feedbackForm" class="modal-form">
                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" name="category" required>
                        <option value="">Select Category</option>
                        <option value="infrastructure">Infrastructure</option>
                        <option value="academic">Academic</option>
                        <option value="hostel">Hostel</option>
                        <option value="canteen">Canteen</option>
                        <option value="transport">Transport</option>
                        <option value="library">Library</option>
                        <option value="technical">Technical</option>
                        <option value="other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="subject">Subject</label>
                    <input type="text" id="subject" name="subject" required placeholder="Brief subject of your feedback">
                </div>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="5" required placeholder="Describe your feedback or grievance in detail..."></textarea>
                </div>

                <div class="form-group">
                    <label for="priority">Priority</label>
                    <select id="priority" name="priority" required>
                        <option value="low">Low</option>
                        <option value="medium" selected>Medium</option>
                        <option value="high">High</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary btn-block">Submit Feedback</button>
            </form>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/socket.js"></script>
    <script src="/js/feedback.js"></script>
</body>
</html>
