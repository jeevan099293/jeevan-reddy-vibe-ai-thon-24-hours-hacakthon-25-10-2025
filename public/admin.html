<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Console - Smart Campus</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body>
  <nav class="navbar navbar-dashboard">
    <div class="container">
    <div class="nav-brand">
      <picture>
        <source srcset="/images/klh-official.png" type="image/png">
        <img src="/images/klh-logo.svg" alt="KLH University" class="site-logo">
      </picture>
      <span>Smart Campus</span>
    </div>
      <ul class="nav-menu">
        <li><a href="/dashboard"><i class="fas fa-home"></i> Dashboard</a></li>
  <li><a href="/events"><i class="fas fa-calendar-alt"></i> Events</a></li>
  <li><a href="/clubs"><i class="fas fa-users"></i> Clubs</a></li>
  <li><a href="/announcements"><i class="fas fa-bullhorn"></i> Announcements</a></li>
  <li><a href="/admin" class="active"><i class="fas fa-tools"></i> Admin Console</a></li>
      </ul>
      <div class="user-menu">
        <span id="userName">User</span>
        <button onclick="logout()" class="btn btn-small"><i class="fas fa-sign-out-alt"></i> Logout</button>
      </div>
    </div>
  </nav>

  <div class="page-container">
    <div class="page-header">
      <h1><i class="fas fa-tools"></i> Admin Console</h1>
  <p style="color: var(--text-secondary);">Manage events, announcements, and clubs. Some actions require admin role.</p>
    </div>

    <div class="grid-2">
      <!-- Events -->
      <section class="card">
        <div class="card-header">
          <h2><i class="fas fa-calendar-alt"></i> Events</h2>
        </div>
        <form id="eventForm" class="modal-form" style="margin-bottom: 12px;">
          <div class="form-row">
            <div class="form-group">
              <label>Title</label>
              <input type="text" name="title" required />
            </div>
            <div class="form-group">
              <label>Date</label>
              <input type="date" name="event_date" required />
            </div>
            <div class="form-group">
              <label>Time</label>
              <input type="time" name="event_time" required />
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Location</label>
              <input type="text" name="location" required />
            </div>
            <div class="form-group">
              <label>Category</label>
              <select name="category" required>
                <option value="technical">Technical</option>
                <option value="cultural">Cultural</option>
                <option value="workshop">Workshop</option>
                <option value="sports">Sports</option>
                <option value="other">Other</option>
              </select>
            </div>
            <div class="form-group">
              <label>Max Participants</label>
              <input type="number" name="max_participants" min="0" value="0" />
            </div>
          </div>
          <div class="form-group">
            <label>Description</label>
            <textarea name="description" rows="3" required></textarea>
          </div>
          <div class="form-group">
            <label>Image URL (optional)</label>
            <input type="url" name="image_url" />
          </div>
          <button type="submit" class="btn btn-primary"><i class="fas fa-plus"></i> Create Event</button>
        </form>
        <div id="eventsList" class="list"></div>
      </section>

      <!-- Announcements -->
      <section class="card">
        <div class="card-header">
          <h2><i class="fas fa-bullhorn"></i> Announcements</h2>
        </div>
        <form id="announcementForm" class="modal-form" style="margin-bottom: 12px;">
          <div class="form-group">
            <label>Title</label>
            <input type="text" name="title" required />
          </div>
          <div class="form-group">
            <label>Message</label>
            <textarea name="message" rows="3" required></textarea>
          </div>
          <div class="form-group">
            <label>Priority</label>
            <select name="priority">
              <option value="normal">Normal</option>
              <option value="high">High</option>
            </select>
          </div>
          <button type="submit" class="btn btn-primary"><i class="fas fa-plus"></i> Create Announcement</button>
        </form>
        <div id="announcementsList" class="list"></div>
      </section>

      <!-- Clubs -->
      <section class="card">
        <div class="card-header">
          <h2><i class="fas fa-users"></i> Clubs</h2>
        </div>
        <form id="clubForm" class="modal-form" style="margin-bottom: 12px;">
          <div class="form-group">
            <label>Name</label>
            <input type="text" name="name" required />
          </div>
          <div class="form-group">
            <label>Description</label>
            <textarea name="description" rows="2" required></textarea>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Category</label>
              <select name="category">
                <option value="technical">Technical</option>
                <option value="cultural">Cultural</option>
                <option value="academic">Academic</option>
                <option value="sports">Sports</option>
                <option value="other">Other</option>
              </select>
            </div>
            <div class="form-group">
              <label>President</label>
              <input type="text" name="president" />
            </div>
            <div class="form-group">
              <label>Contact Email</label>
              <input type="email" name="contact_email" />
            </div>
          </div>
          <div class="form-group">
            <label>Image URL (optional)</label>
            <input type="url" name="image_url" />
          </div>
          <button type="submit" class="btn btn-primary"><i class="fas fa-plus"></i> Create Club</button>
        </form>
        <div id="clubsList" class="list"></div>
      </section>
    </div>
  </div>

  <script src="/js/utils.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
